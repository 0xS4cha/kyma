name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Love2D and Dependencies
      run: |
        # Ubuntu 24.04 ships LÖVE 11.5 in universe; the bartbes PPA kept failing with 503s.
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install -y love xvfb
        love --version

    - name: Run the test suite
      run: |
        love . --test

    - name: Verify the game boots
      run: |
        xvfb-run -a love . --autoplay --frames 3000

    - name: Verify the main menu and a practice game boot
      run: |
        xvfb-run -a love . --frames 1500
        xvfb-run -a love . --practice hard --frames 1500

    - name: Lua Diagnostics (LuaLS)
      uses: mrcjkb/lua-typecheck-action@v0
      with:
        configpath: ".luarc.json"
